<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match Five has moved to burgerfun.ca</title>
    <link rel="canonical" href="https://burgerfun.ca/match-five/" />
    <meta http-equiv="refresh" content="0; url=https://burgerfun.ca/match-five/" />
    <script>
      // Keep an old level link working: the game routes on the hash
      // (#/play/level_3), and burgerfun.ca serves the same game.
      location.replace('https://burgerfun.ca/match-five/' + (/^#\/[\w\/-]*$/.test(location.hash) ? location.hash : ''));
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
        background: #ffffff;
      }
      a {
        color: #1a237e;
      }
    </style>
  </head>
  <body>
    <h1>Match Five has moved</h1>
    <p>
      Match Five lives at
      <a href="https://burgerfun.ca/match-five/">burgerfun.ca/match-five</a>.
    </p>
    <p>If you are not redirected automatically, follow the link above.</p>
  </body>
</html>
